<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="数一刷题">
  <meta name="theme-color" content="#4f46e5">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="考研数学一刷题助手：按真题/模拟规则与分值表自动出卷">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css" onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='https://fastly.jsdelivr.net/npm/katex@0.16/dist/katex.min.css';document.head.appendChild(l);">
  <title>考研数学一 · 刷题助手</title>
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="brand">🧮 数一刷题助手</div>
      <div class="topbar-right">
        <span class="stat-chip due-chip" id="statDue" style="display:none">🔔 待复习 0</span>
        <span class="stat-chip">已做题 <b id="statTotal">0</b></span>
        <span class="stat-chip">正确率 <b id="statRate">—</b></span>
      </div>
    </header>

    <main id="view" class="main"></main>

    <nav class="tabbar">
      <button class="tab active" data-tab="math"><span class="tab-icon">📐</span><span>数学</span></button>
      <button class="tab" data-tab="english"><span class="tab-icon">🇬🇧</span><span>英语</span></button>
      <button class="tab" data-tab="major"><span class="tab-icon">📚</span><span>专业课</span></button>
      <button class="tab" data-tab="wrong"><span class="tab-icon">⭐</span><span>错题<span class="tab-badge" id="wrongBadge" style="display:none"></span></span></button>
    </nav>

  </div>
  <div id="toast" class="toast"></div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="sp-head">
        <div class="sp-title">⚙️ 设置</div>
        <button class="icon-btn" id="btnCloseSettings">✕</button>
      </div>
      <div class="sp-section">
        <div class="sp-label">🔑 DeepSeek API Key（用于「💡 思路提示」的 AI 个性化思路）</div>
        <input type="password" id="setKey" placeholder="sk-…">
        <p class="sp-hint">密钥只保存在本机浏览器，与「AI 助手」应用共用。没有密钥时，思路提示会自动降级为章节通用思路。注册地址：<a href="https://platform.deepseek.com" target="_blank" rel="noopener">platform.deepseek.com</a></p>
      </div>
      <div class="sp-section">
        <div class="sp-label">🧠 提示模型</div>
        <select id="setHintModel">
          <option value="deepseek-chat">deepseek-chat（快、省）</option>
          <option value="deepseek-reasoner">deepseek-reasoner（更深）</option>
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="btnSaveSettings">💾 保存</button>
    </div>
  </div>

  <script src="chapters.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js" onerror="var s=document.createElement('script');s.src='https://fastly.jsdelivr.net/npm/katex@0.16/dist/katex.min.js';document.head.appendChild(s);"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js" onerror="var s=document.createElement('script');s.src='https://fastly.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js';document.head.appendChild(s);"></script>
  <script src="app.js"></script>
</body>
</html>
